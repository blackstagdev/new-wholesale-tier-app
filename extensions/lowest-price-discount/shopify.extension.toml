api_version = "2025-07"

[[extensions]]
name = "Wholesale tiers (lowest price)"
handle = "lowest-price-discount"
type = "function"

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart-lines-discounts-generate-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"

  # Customer tags + collection IDs used by all rules are passed in as
  # GraphQL variables from this discount metafield (written by the Pricing page).
  [extensions.input.variables]
  namespace = "$app:wlp"
  key = "variables"

